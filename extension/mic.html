<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Microphone permission</title></head>
<body>
  <p>Open Dialer needs microphone access to place calls. If the browser prompt never appears:</p>
  <ol>
    <li>Copy this extension's <code>chrome-extension://</code> URL from the address bar when the side panel is open.</li>
    <li>Open <code>chrome://settings/content/siteDetails</code> and paste that URL.</li>
    <li>Set Microphone to "Allow".</li>
  </ol>
</body>
</html>
